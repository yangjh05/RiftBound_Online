<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riftbound Online</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      color: #f4f1e8; background:
        radial-gradient(circle at 20% 0%, rgba(68, 130, 186, .25), transparent 40%),
        radial-gradient(circle at 90% 100%, rgba(173, 104, 54, .22), transparent 38%),
        linear-gradient(145deg, #080c12, #111925 58%, #080c12);
      user-select: none;
    }
    body::before {
      content: ""; position: fixed; inset: 1px; border: 1px solid rgba(222, 187, 115, .25); pointer-events: none;
    }
    main { width: 510px; text-align: center; }
    .sigil {
      width: 76px; height: 76px; margin: 0 auto 19px; display: grid; place-items: center;
      border: 1px solid #d8af66; border-radius: 50%; color: #e9c57d; font: 700 30px Georgia, serif;
      box-shadow: 0 0 35px rgba(220, 169, 79, .18), inset 0 0 22px rgba(220, 169, 79, .08);
      animation: breathe 2.2s ease-in-out infinite;
    }
    h1 { margin: 0; font: 600 26px Georgia, "Malgun Gothic", serif; letter-spacing: .12em; }
    .subtitle { margin: 7px 0 30px; color: #94a2b5; font-size: 12px; letter-spacing: .2em; }
    .status { min-height: 25px; margin-bottom: 12px; font-size: 15px; font-weight: 600; }
    .track { height: 6px; overflow: hidden; border-radius: 10px; background: rgba(255,255,255,.08); box-shadow: inset 0 1px 2px #0008; }
    .bar { height: 100%; width: 4%; border-radius: inherit; background: linear-gradient(90deg, #4c90bd, #e2b866); transition: width .22s ease; }
    .bar.indeterminate { width: 34%; animation: travel 1.35s ease-in-out infinite; }
    .detail { min-height: 20px; margin-top: 11px; color: #8997a9; font-size: 12px; }
    .steps { margin-top: 28px; display: flex; align-items: center; justify-content: center; color: #596575; font-size: 11px; }
    .step { transition: color .2s; }
    .step.active { color: #e4be77; }
    .step.done { color: #8eb5cc; }
    .dot { width: 22px; height: 1px; margin: 0 7px; background: #303a48; }
    @keyframes travel { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
    @keyframes breathe { 50% { transform: scale(1.035); box-shadow: 0 0 48px rgba(220, 169, 79, .27); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="sigil">R</div>
    <h1>RIFTBOUND ONLINE</h1>
    <div class="subtitle">SECURE LAUNCHER</div>
    <div class="status" id="status">시작 준비 중입니다…</div>
    <div class="track"><div class="bar indeterminate" id="bar"></div></div>
    <div class="detail" id="detail">잠시만 기다려 주세요.</div>
    <div class="steps">
      <span class="step active" data-step="check">확인</span><i class="dot"></i>
      <span class="step" data-step="download">다운로드</span><i class="dot"></i>
      <span class="step" data-step="verify">검증</span><i class="dot"></i>
      <span class="step" data-step="apply">교체 및 재실행</span>
    </div>
  </main>
  <script>
    const order = ["check", "download", "verify", "apply"];
    const phaseStep = { initializing: "check", recovering: "check", checking: "check", current: "check", available: "download", downloading: "download", verifying: "verify", ready: "apply", awaiting: "apply", preparing: "apply", applying: "apply", launching: "apply", error: "check", disabled: "check", deferred: "check" };
    const statusEl = document.querySelector("#status");
    const detailEl = document.querySelector("#detail");
    const barEl = document.querySelector("#bar");
    window.riftboundUpdater.onStatus((state = {}) => {
      statusEl.textContent = state.message || "업데이트를 확인하고 있습니다…";
      detailEl.textContent = state.detail || "";
      const progress = Number(state.progress);
      if (Number.isFinite(progress)) {
        barEl.classList.remove("indeterminate");
        barEl.style.width = `${Math.max(2, Math.min(100, progress * 100))}%`;
      } else {
        barEl.classList.add("indeterminate");
        barEl.style.width = "34%";
      }
      const active = order.indexOf(phaseStep[state.phase] || "check");
      document.querySelectorAll(".step").forEach((node, index) => {
        node.classList.toggle("done", index < active);
        node.classList.toggle("active", index === active);
      });
    });
  </script>
</body>
</html>
