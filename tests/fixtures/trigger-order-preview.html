<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/src/styles.css" />
  <title>Trigger order preview</title>
</head>
<body>
  <main id="app">
    <div class="floating-panels has-modal">
      <section class="choice-panel modal-panel trigger-order-panel">
        <div class="section-head trigger-order-head">
          <div>
            <h2>동시 유발 효과 순서 선택</h2>
            <span>3개 중 2번째 해결 효과를 정합니다</span>
            <p class="choice-instruction trigger-order-instruction">지금 선택한 효과가 먼저 해결됩니다. 선택 후 남은 효과의 순서를 계속 정합니다.</p>
          </div>
        </div>
        <div class="trigger-order-track">
          <div class="trigger-order-step is-chosen"><b>1</b><span>애니, 고집불통</span></div>
          <div class="trigger-order-step is-current"><b>2</b><span>지금 선택</span></div>
          <div class="trigger-order-step is-pending"><b>3</b><span>대기</span></div>
        </div>
        <div class="trigger-order-selected">
          <strong>선택한 해결 순서</strong>
          <ol><li><b>애니, 고집불통</b><span>유닛을 사용했을 때 피해를 줍니다.</span></li></ol>
        </div>
        <div class="choice-grid trigger-order-grid">
          <div class="choice-option-wrap trigger-order-option-wrap">
            <button class="choice-option trigger-order-option">
              <strong class="trigger-order-rank">2순위로 해결</strong>
              <span class="choice-card-fallback">마법공학 집행자</span>
              <span class="choice-card-name">마법공학 집행자</span>
              <span class="trigger-order-kind">유발 스킬</span>
              <small class="trigger-order-effect">이 유닛을 사용할 때 카드를 1장 버리고 상대 유닛 하나에게 피해를 줍니다.</small>
            </button>
          </div>
          <div class="choice-option-wrap trigger-order-option-wrap">
            <button class="choice-option trigger-order-option">
              <strong class="trigger-order-rank">2순위로 해결</strong>
              <span class="choice-card-fallback">까마귀꽃 학생</span>
              <span class="choice-card-name">까마귀꽃 학생</span>
              <span class="trigger-order-kind">유발 스킬</span>
              <small class="trigger-order-effect">다른 카드를 사용할 때 이 유닛이 이번 턴 동안 추가 위력을 얻습니다.</small>
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
