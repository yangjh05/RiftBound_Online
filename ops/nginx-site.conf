server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name punchfirst.site www.punchfirst.site;

    ssl_certificate /etc/letsencrypt/live/punchfirst.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/punchfirst.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/auth/ {
        limit_req zone=riftbound_auth burst=10 nodelay;
        include /etc/nginx/snippets/riftbound-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/riftbound-proxy.conf;
    }
}

# Keep released desktop clients using the former endpoint operational while
# they learn the new update and multiplayer base URL from build-info.json.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name riftbound-online.15-164-73-107.nip.io;

    ssl_certificate /etc/letsencrypt/live/riftbound-online.15-164-73-107.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/riftbound-online.15-164-73-107.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/auth/ {
        limit_req zone=riftbound_auth burst=10 nodelay;
        include /etc/nginx/snippets/riftbound-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/riftbound-proxy.conf;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name punchfirst.site www.punchfirst.site riftbound-online.15-164-73-107.nip.io;
    return 301 https://$host$request_uri;
}
